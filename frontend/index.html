<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "css/dashboard.css">
    <link rel = "stylesheet" href = "css/header.css">
    <link rel = "stylesheet" href = "css/mainpartition.css">
    <link rel = "stylesheet" href = "css/button.css">
    <link rel = "stylesheet" href = "css/textarea.css">
    <link rel = "stylesheet" href = "css/tabs.css">
    
    <link rel = "stylesheet" href = "css/matricscard.css">
    <title>VEIL</title>
    
    
</head>
<body>
    <div class="veil-container">
        <div class="veil-header">
            <div class="veil-logo">VEIL</div>
            <div class="veil-status-dot"></div>
        </div>

        <div class="veil-main">
            <div class="veil-panel veil-left">
                <div class="veil-panel-header">QUERY INPUT</div>
                <div class="veil-input-section">
                    <textarea class="veil-textarea"></textarea>
                    <div class="veil-controls">
                        <button class="veil-button">Analyze</button>
                        <button class="veil-button-secondary">Optimize</button>
                        <button class="veil-button-tertiary">Clear</button>
                        <span class="veil-shortcut">ctrl+enter</span>
                    </div>
        
                </div>

            </div>
             <div class="veil-panel veil-right">
                <div class="veil-panel-header">ANALYSIS RESULTS</div>
                <div class="veil-tabs">
                    <button class="veil-tab">MATRICS</button>
                    <button class="veil-tab">OUTPUT</button>
                    <button class="veil-tab">EXECUTION PLANE</button>
                </div>

                <div class="veil-right-content">
                    <div id="metrics" class="veil-tab-content">
                        <div class="veil-metrics">
                            <div class="veil-metrics-card">EXECUTION TIME
                                <div class="veil-metrics-value">324ms</div>
                            </div>
                            <div class="veil-metrics-card">ROWS ANALYZED
                                <div class="veil-metrics-value">12,847</div>
                            </div>
                            <div class="veil-metrics-card">INDEX
                                <div class="veil-metrics-value">85%</div>
                            </div>
                            <div class="veil-metrics-card">ROWS
                                <div class="veil-metrics-value">247</div>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 1rem; padding: 1rem; background: rgba(76, 175, 80, 0.1); border-radius: 6px; border-left: 3px solid #4caf50;">
                        <div style="font-size: 12px; color: #4caf50; font-weight: 600;">✓ Query Optimized</div>
                        <div style="font-size: 11px; color: #888; margin-top: 6px;">Good index usage detected. Consider adding covering index on orders(user_id, id).</div>
                    </div>
                    <div id="output" class="veil-tab-content">     
                     <table class="veil-output-table">
                    <div id="plan" class="veil-tab-content">      
                    <div class="veil-plan-node">
                        
                </div>
                
             </div>

        </div>
    </div>
</body>
</html>
